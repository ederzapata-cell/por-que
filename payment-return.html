<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pago recibido · ¿Por qué?</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#FFF9F3;
      font-family:Nunito,system-ui,sans-serif;
      color:#10245B;
    }
    .return-card{
      width:min(92vw,520px);
      background:#fff;
      border-radius:28px;
      padding:32px;
      box-shadow:0 20px 60px rgba(16,36,91,.12);
      text-align:center;
    }
    .return-card h1{margin-top:0}
    .return-card a{
      display:inline-block;
      margin-top:18px;
      padding:14px 22px;
      border-radius:16px;
      text-decoration:none;
      background:#10245B;
      color:#fff;
      font-weight:800;
    }
  </style>
</head>
<body>
  <main class="return-card">
    <h1>Pago recibido</h1>
    <p>Estamos confirmando la transacción con Wompi.</p>
    <p>Cuando el pago sea aprobado, tu acceso se activará automáticamente.</p>
    <a href="/">Volver a ¿Por qué?</a>
  </main>
</body>
</html>
